# MCPME reachable only on your tailnet, at https://mcpme.<tailnet>.ts.net.
# Needs MagicDNS and HTTPS certificates turned on for the tailnet.
services:
  mcpme:
    build: .
    restart: unless-stopped
    environment:
      MCPME_PUBLIC_URL: ${MCPME_PUBLIC_URL:?}
      MCPME_SECRET_KEY: ${MCPME_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - mcpme-data:/data

  tailscale:
    build: ./tailscale
    restart: unless-stopped
    environment:
      TS_HOSTNAME: mcpme
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    healthcheck:
      # Healthy once the node is logged in and on the tailnet.
      test: ["CMD-SHELL", "tailscale status --peers=false --json | grep -q '\"BackendState\": \"Running\"'"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mcpme-data:
  tailscale-state:
